services:
  mongodb:
    image: mongo:7.0
    container_name: pulsepoll-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: pulsepoll
    volumes:
      - mongodb_data:/data/db
    networks:
      - pulsepoll-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: pulsepoll-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - pulsepoll-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pulsepoll:latest
    container_name: pulsepoll-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      GIN_MODE: release
      # Service names resolve on the compose network (not localhost).
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: pulsepoll
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_TLS: "false"
      # Set a real secret in your shell or a root .env file before deploying.
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRY_HOURS: "72"
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-http://localhost:8080}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pulsepoll-network

volumes:
  mongodb_data:
  redis_data:

networks:
  pulsepoll-network:
    driver: bridge
